<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QRFila - Gerador de QR Codes</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


<style>

*{
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}


body{

    margin:0;
    padding:20px;
    background:#eeeeee;

}


h1{

    text-align:center;
    color:#0B6E4F;

}


.botoes{

    display:flex;
    justify-content:center;
    gap:15px;
    margin:25px;

}


button{

    background:#0B6E4F;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;

}


button:hover{

    background:#09553d;

}


#folhas{

    display:flex;
    flex-direction:column;
    align-items:center;

}


/* Prévia das páginas */

.pagina{

    width:210mm;
    height:297mm;

    background:white;

    display:grid;

    grid-template-columns:repeat(2,7cm);

    grid-template-rows:repeat(2,7cm);

    gap:4cm;

    padding:3cm;

    margin-bottom:80px;

    box-shadow:0 5px 20px rgba(0,0,0,0.15);

}



/* Cartão */

.qr{

    width:7cm;
    height:7cm;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    border:1px solid #ccc;

}


.qr canvas{

    width:5cm !important;
    height:5cm !important;

}


.numero{

    margin-top:8px;

    font-size:20px;

    font-weight:bold;

}



@media print{


body{

    background:white;
    padding:0;

}


h1,.botoes{

    display:none;

}


.pagina{

    margin:0;

    box-shadow:none;

    page-break-after:always;

}


}


</style>

</head>


<body>


<h1>
QRFila - Gerador de QR Codes
</h1>



<div class="botoes">

<button onclick="gerarQR()">
Gerar QR Codes
</button>


<button onclick="baixarPDF()">
Baixar PDF
</button>

</div>



<div id="folhas"></div>




<script>


let gerado=false;




function gerarQR(){


const folhas=document.getElementById("folhas");

folhas.innerHTML="";


let pagina;



for(let i=1;i<=40;i++){


    if((i-1)%4===0){


        pagina=document.createElement("div");

        pagina.className="pagina";

        folhas.appendChild(pagina);


    }



    const caixa=document.createElement("div");

    caixa.className="qr";



    const canvas=document.createElement("canvas");



    const numero=document.createElement("div");

    numero.className="numero";


    numero.textContent="Nº "+String(i).padStart(3,"0");



    const link =

    window.location.origin +

    window.location.pathname.replace("admin.html","") +

    "?n="+i;



    QRCode.toCanvas(

        canvas,

        link,

        {

            width:500,

            margin:0

        }

    );



    caixa.appendChild(canvas);

    caixa.appendChild(numero);


    pagina.appendChild(caixa);


}



gerado=true;


}





async function baixarPDF(){


if(!gerado){

alert("Primeiro gere os QR Codes.");

return;

}



const {jsPDF}=window.jspdf;



const pdf=new jsPDF({

    orientation:"portrait",

    unit:"mm",

    format:"a4"

});



const caixas=document.querySelectorAll(".qr");



for(let i=0;i<caixas.length;i++){



    if(i>0 && i%4===0){

        pdf.addPage();

    }



    const canvas=

    caixas[i].querySelector("canvas");



    const imagem=

    canvas.toDataURL("image/png");



    const posicao=i%4;



    const coluna=posicao%2;

    const linha=Math.floor(posicao/2);



    const x=25+(coluna*90);

    const y=30+(linha*100);



    pdf.addImage(

        imagem,

        "PNG",

        x,

        y,

        50,

        50

    );



    pdf.setFontSize(18);



    pdf.text(

        "Nº "+String(i+1).padStart(3,"0"),

        x+12,

        y+65

    );


}



pdf.save("QRFila_QR_Codes.pdf");


}



</script>


</body>

</html>
