<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QRFila - Gerador de QR Codes</title>


<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


<style>


*{
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}


body{

    margin:0;
    padding:20px;

    background:#eeeeee;

}



h1{

    text-align:center;

    color:#0B6E4F;

}



.botoes{

    display:flex;

    justify-content:center;

    gap:15px;

    margin:25px;

}



button{

    background:#0B6E4F;

    color:white;

    border:none;

    padding:15px 25px;

    border-radius:10px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

}



button:hover{

    background:#09553d;

}



/* Área das páginas */

#folhas{

    display:flex;

    flex-direction:column;

    align-items:center;

}



/* Página A4 horizontal */

.pagina{


    width:297mm;

    height:210mm;


    background:white;


    display:grid;


    grid-template-columns:repeat(3,7cm);

    grid-template-rows:repeat(4,7cm);


    gap:1cm;


    padding:1cm;


    margin-bottom:80px;


    box-shadow:0 5px 20px rgba(0,0,0,0.15);


}



/* Cartão do QR */

.qr{


    width:7cm;

    height:7cm;


    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;


    border:1px solid #cccccc;


}



/* QR central 5cm */

.qr canvas{

    width:5cm !important;

    height:5cm !important;

}



.numero{


    margin-top:8px;


    font-size:20px;


    font-weight:bold;


}




/* Impressão */

@media print{


body{

    background:white;

    padding:0;

}



h1,.botoes{

    display:none;

}



.pagina{


    margin:0;

    box-shadow:none;

    page-break-after:always;

}



}



</style>


</head>


<body>


<h1>
QRFila - Gerador de QR Codes
</h1>



<div class="botoes">


<button onclick="gerarQR()">

Gerar QR Codes

</button>



<button onclick="baixarPDF()">

Baixar PDF

</button>


</div>




<div id="folhas"></div>




<script>


let gerado=false;



function gerarQR(){


const folhas=document.getElementById("folhas");


folhas.innerHTML="";


let pagina;



for(let i=1;i<=40;i++){



    if((i-1)%12===0){


        pagina=document.createElement("div");

        pagina.className="pagina";


        folhas.appendChild(pagina);


    }



    const caixa=document.createElement("div");

    caixa.className="qr";



    const canvas=document.createElement("canvas");



    const numero=document.createElement("div");

    numero.className="numero";



    let texto=String(i).padStart(3,"0");


    numero.textContent="Nº "+texto;




    const link=

    window.location.origin +

    window.location.pathname.replace("admin.html","") +

    "?n="+i;



    QRCode.toCanvas(

        canvas,

        link,

        {

            width:500,

            margin:0

        }

    );




    caixa.appendChild(canvas);

    caixa.appendChild(numero);



    pagina.appendChild(caixa);



}



gerado=true;


}





async function baixarPDF(){



if(!gerado){

alert("Primeiro gere os QR Codes.");

return;

}



const {jsPDF}=window.jspdf;



const pdf=new jsPDF({


orientation:"landscape",

unit:"mm",

format:"a4"


});



const caixas=document.querySelectorAll(".qr");



for(let i=0;i<caixas.length;i++){



    if(i>0 && i%12===0){

        pdf.addPage();

    }



    const canvas=

    caixas[i].querySelector("canvas");



    const imagem=

    canvas.toDataURL("image/png");



    let coluna=i%3;

    let linha=Math.floor((i%12)/3);



    let x=10+(coluna*95);

    let y=10+(linha*48);



    pdf.addImage(

        imagem,

        "PNG",

        x+10,

        y,

        50,

        50

    );



    pdf.setFontSize(16);



    pdf.text(

        "Nº "+String(i+1).padStart(3,"0"),

        x+25,

        y+60

    );



}



pdf.save("QRFila_QR_Codes.pdf");



}


</script>


</body>

</html>
